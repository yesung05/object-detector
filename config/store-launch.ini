# 출시 프로파일 (매장 첫 설치용) — config/store.example.ini 를 바탕으로 한 권고 값
#
# 사용: 이 파일을 복사해 config.json 대신(또는 매장 설정 위에) 적용한다. 설명은 docs/store-launch-checklist.md 에 있다.
# 원칙: 근거가 충분한 알림만 on, 정밀도를 모르는 알림은 shadow(기록만 하고 점주 알림 피드에는 안 보임), 미검증은 off.
# 근거 수치: docs/anomaly-dataset-improvements-2026-11-05.md, docs/detection-status.md, 현장 로그 6일 분석.
#
# shadow 알림은 이벤트 기록(logs/*.db)에 "mode=shadow" 가 붙어 남는다. 대시보드 피드에는 보이지 않으므로 설치 후
# scripts/analyze_field_logs.py 로 집계해서 켤지 판단한다.

# ── 알림 모드 (on | shadow | off) ────────────────────────────────────────────
# on: 쓰러짐·초과 체류·미주문 착석·문 장기 개방.
#   - 쓰러짐은 현장 6일 발화 0, AI-Hub 음성 클립 오탐 0 이라 켠다. 재현율은 낮다(문서 참조) — 연출 시험으로 확인.
#   - 미주문 착석은 키오스크 ROI(roi_kiosk)를 설정한 매장에서만 판정한다(ROI 가 없으면 코드가 자동으로 건너뜀).
alert_person_fallen = on
alert_overstay = on
alert_unordered_seated = on
alert_door_open = on

# shadow: 현장 정밀도를 모르거나 오탐이 많은 것.
#   - 내부 소실: 필드 6일 613건(약 4건/시간), 전부 문 ROI 미설정(door=unknown) 상태였다.
#   - 외부 음료·음식·1인 1음료: 병·컵 AP 0.33~0.40, 매장 판매 음료와 외부 음료를 구분하지 못한다.
#   - 반려동물·잔류물·표면: 현장 정답 없음, 잔류물은 기준 이미지 필요.
alert_person_unaccounted = shadow
alert_person_unaccounted_residue = shadow
alert_external_drink = shadow
alert_external_food = shadow
alert_no_cup_seated = shadow
alert_animal_on_chair = shadow
alert_animal_on_table = shadow
alert_residue_trash = shadow
alert_residue_spill = shadow
alert_residue_unknown = shadow
alert_slot_item_urgent = shadow

# off: 미검증. 켜려면 임계값(max_occupancy 등)도 같이 정해야 한다.
alert_occupancy_exceeded = off
alert_person_motionless = off

# ── 감지 설정 ────────────────────────────────────────────────────────────────
# 자동 테이블 탐색: 현장 식탁 검출 점수 중앙값 0.28·최대 0.40 이라 기존 0.55 로는 한 번도 등록되지 않았다.
# 이미 0.55 로 저장된 매장은 이 값으로 바꿔야 한다(코드 기본값은 0.28).
table_confidence = 0.28

# 오래 떠났다 돌아온 트랙의 체류를 처음부터 센다(초). 필드에서 한 id 가 2~3시간 체류로 쌓이던 문제의 수정.
reid_dwell_keep_seconds = 300

# 안정화(보정) 실패 시 이 시간(분) 뒤 사람이 없을 때 재시도. 0 이면 재시도 안 함.
calib_retry_minutes = 30

# 쓰러짐 판정은 기본값 유지. 보강 기능(fall_handoff_seconds, fall_wide_ratio)은 켜지 않는다:
# 연출 3fps 데이터에서만 검증됐고 카페(앉은 사람)의 오탐은 확인하지 못했다. 시험하려면 config/store.example.ini 의
# 해당 항목을 보고 켠 뒤 쓰러짐 알림 오탐을 따로 점검한다(보강 발화는 evidence=upright_to_wide_box 로 구분된다).
fall_hold_seconds = 5

# ── 보호·기록 ────────────────────────────────────────────────────────────────
# 영상 외부 전송 금지. 보호 모드는 스트림·스냅샷·저장 사진에 박스·관절만 남긴다(기본 켬).
stream_privacy_mode = 1
capture_fall = 1
# 로그 총량 상한(MB). 매장 디스크 여유에 맞춰 조정한다(리플레이가 시간당 수십 MB).
log_max_total_mb = 5120
