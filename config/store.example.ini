# 매장별 설정 파일 예시
# 실제 사용 시 이 파일을 복사하여 store.ini 로 저장하고
# --config config/store.ini 로 지정합니다.

# ── 초과 체류 감지 ──────────────────────────────────────────────────────────
# 착석 후 이 시간(초)이 지나면 "overstay" 이벤트를 발화합니다.
# 7~10평 무인 카페 기본값: 1시간(3600초)
dwell_limit_seconds = 3600

# ── 미주문 착석 감지 ─────────────────────────────────────────────────────────
# 입장 후 이 시간(초) 동안 키오스크 ROI를 통과하지 않으면 "unordered_seated" 발화.
# 손님이 메뉴를 고르는 시간을 감안해 기본 5분(300초).
unordered_grace_seconds = 300

# ── 쓰러짐 감지 ──────────────────────────────────────────────────────────────
# 수평 자세가 이 시간(초) 이상 지속되면 "person_fallen" 이벤트를 발화합니다.
# 짧으면 오탐, 길면 응급상황 대응이 늦어집니다. 기본 5초.
fall_hold_seconds = 5

# ── 모션 게이트 ───────────────────────────────────────────────────────────────
# 픽셀 변화 비율이 이 값 미만이면 정적 장면으로 판단해 YOLO 추론을 건너뜁니다.
# 0.004 = 그레이 버퍼(1/4 다운샘플)의 0.4% 픽셀이 8 이상 변해야 추론 실행.
# 빈 매장처럼 정적인 환경일수록 높여도 됩니다(최대 0.05 권장).
motion_ratio_threshold = 0.004

# 마지막 추론 이후 이 시간(초) 안에는 모션 게이트가 발동합니다.
# 10초마다 한 번은 강제로 추론해 새 진입자를 놓치지 않습니다.
idle_refresh_seconds = 10

# ── 잔류물 감지 (바닥 흘림 · 방치된 쓰레기) ─────────────────────────────────
# 설치 후 청결 상태에서 대시보드 → "청결 상태 캡처"를 한 번 실행해야 합니다.

# 기능 활성화. 기준 이미지(residue_clean_reference.raw)가 없으면 자동으로 비활성.
residue_enabled = 1

# 블록 평균 휘도 차 임계값. 낮추면 민감해지고 조명 변화에 취약해집니다.
residue_diff_threshold = 18

# 영역 최소 블록 수. 1블록=원본 64×64px. 이 미만 영역은 노이즈로 폐기합니다.
residue_min_blocks = 3

# 사람 bbox 확장 여유. bbox 경계 흔들림을 흡수합니다.
residue_person_margin_blocks = 1

# 이 시간(초) 이상 지속되어야 이벤트를 발화합니다.
# 손님이 물건을 잠시 내려놓는 정상 행동(~40초)보다 길게 설정합니다.
residue_confirm_seconds = 60

# 이 시간(초) 미관측이면 잔류 해소로 판정합니다. 청소 중 가림 대비.
residue_clear_seconds = 10

# 안전 시점(사람 없음 + 후보 없음)에 기준을 자동 갱신하는 주기(초).
residue_baseline_refresh_seconds = 300

# 후보 블록이 이 비율을 넘으면 조명 변화로 해석하고 기준을 강제 갱신합니다.
residue_global_change_ratio = 0.5

# ── 설치 직후 안정화 (흔들림 구역 자동 무시) ──────────────────────────────────
# 첫 실행 시 이 시간(분) 동안 선풍기·달력처럼 반복해서 흔들리는 구역을 학습해
# --config 파일과 같은 폴더의 calibration.json 에 무시 구역으로 저장합니다.
# 빈 매장 상태에서 진행해야 정확합니다. 0 이면 기능 전체 비활성.
# 재보정: calibration.json 을 지우고 재시작 (카메라 해상도가 바뀌면 자동 재보정).
# 문(door_roi_*)·키오스크(roi_kiosk)·감지된 테이블/의자 슬롯은 흔들려도 무시 구역이 되지 않습니다.
calibration_minutes = 10
# 표본 간격(초). 느린 흔들림도 잡도록 매 프레임이 아니라 간격을 두고 비교합니다.
calib_sample_seconds = 0.5
# 표본 중 이 비율 이상 변한 블록을 흔들림으로 봅니다.
calib_noise_ratio = 0.3
# 후보 구역이 화면의 이 비율보다 크면 자동 적용하지 않습니다 (조명·TV 등).
calib_max_area_ratio = 0.15

# ── 이벤트 캡처 ───────────────────────────────────────────────────────────────
# person_fallen 이 발생하면 그 순간 프레임을 captures/ 에 JPEG 로 저장합니다(쓰러진 사람 박스 표시).
# 저장 위치는 --config 파일과 같은 폴더의 captures/ 로 고정입니다 — 외부 경로 차단.
# stream_privacy_mode=1 이면 영상은 지우고 박스·관절만 남긴 사진으로 저장합니다.
capture_fall = 1
# JPEG 품질 30~100.
capture_quality = 85

# ── 카메라 끊김 자동 재연결 (--camera 에서만) ────────────────────────────────
# 카메라가 뽑히거나 프레임이 멈추면 프로세스를 끝내지 않고 다시 연결합니다.
# 대기 시간은 1, 2, 4 ... 초로 늘어나며 camera_reconnect_max_backoff 에서 멈춥니다.
camera_reconnect = 1
# 이 시간(초) 동안 새 프레임이 없으면 끊김으로 봅니다. 2~60.
camera_stall_seconds = 5
camera_reconnect_max_backoff = 30
# 이 시간(초) 동안 다시 붙지 못하면 exit 3 으로 끝냅니다. run-all.ps1 감시 루프가
# 재시작하면서 카메라 장치를 새로 찾습니다. 0 = 무한 재시도.
camera_reconnect_giveup_seconds = 300

# ── 카메라 대비 저하 (김서림·초점 상실·반투명 가림) ────────────────────────────
# 선명도 비율(평균 가로 기울기 / 평균 밝기)이 이 값 미만이면 대비 저하 후보입니다. 0 = 끔.
# 조명을 낮춘 매장은 비율이 그대로라 걸리지 않습니다. 흰 벽만 보이는 화각은 낮춰야 할 수 있습니다.
camera_low_contrast_ratio = 0.045
# 이 프레임 수 이상 이어질 때만 확정합니다(15fps 기준 300 = 약 20초).
camera_low_contrast_hold_frames = 300

# ── 추적: 2단계 매칭 ──────────────────────────────────────────────────────────
# --confidence 미만이지만 이 값 이상인 박스로 "기존 트랙만" 이어 줍니다(새 트랙은 안 만듦).
# 반쯤 가려지거나 자세가 바뀌어 신뢰도가 떨어진 손님의 ID 가 끊기지 않게 합니다. 0 = 끔. 재시작 필요.
track_low_score = 0.10

# ── 구역 판정 기준점 ──────────────────────────────────────────────────────────
# center = 박스 중심(기본), foot = 발밑(박스 아래 가운데).
# foot 으로 바꾸면 roi_kiosk 를 "손님이 서는 바닥" 위치로 다시 그려야 합니다.
roi_anchor = center
