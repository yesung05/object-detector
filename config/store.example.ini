# 매장별 설정 파일 예시
# 실제 사용 시 이 파일을 복사하여 store.ini 로 저장하고
# --config config/store.ini 로 지정합니다.

# ── 초과 체류 감지 ──────────────────────────────────────────────────────────
# 착석 후 이 시간(초)이 지나면 "overstay" 이벤트를 발화합니다.
# 7~10평 무인 카페 기본값: 1시간(3600초)
dwell_limit_seconds = 3600

# ── 미주문 착석 감지 ─────────────────────────────────────────────────────────
# 입장 후 이 시간(초) 동안 키오스크 ROI를 통과하지 않으면 "unordered_seated" 발화.
# 손님이 메뉴를 고르는 시간을 감안해 기본 5분(300초).
unordered_grace_seconds = 300

# ── 쓰러짐 감지 ──────────────────────────────────────────────────────────────
# 수평 자세가 이 시간(초) 이상 지속되면 "person_fallen" 이벤트를 발화합니다.
# 짧으면 오탐, 길면 응급상황 대응이 늦어집니다. 기본 5초.
fall_hold_seconds = 5

# ── 모션 게이트 ───────────────────────────────────────────────────────────────
# 픽셀 변화 비율이 이 값 미만이면 정적 장면으로 판단해 YOLO 추론을 건너뜁니다.
# 0.004 = 그레이 버퍼(1/4 다운샘플)의 0.4% 픽셀이 8 이상 변해야 추론 실행.
# 빈 매장처럼 정적인 환경일수록 높여도 됩니다(최대 0.05 권장).
motion_ratio_threshold = 0.004

# 마지막 추론 이후 이 시간(초) 안에는 모션 게이트가 발동합니다.
# 10초마다 한 번은 강제로 추론해 새 진입자를 놓치지 않습니다.
idle_refresh_seconds = 10

# ── 잔류물 감지 (바닥 흘림 · 방치된 쓰레기) ─────────────────────────────────
# 설치 후 청결 상태에서 대시보드 → "청결 상태 캡처"를 한 번 실행해야 합니다.

# 기능 활성화. 기준 이미지(residue_clean_reference.raw)가 없으면 자동으로 비활성.
residue_enabled = 1

# 블록 평균 휘도 차 임계값. 낮추면 민감해지고 조명 변화에 취약해집니다.
residue_diff_threshold = 18

# 영역 최소 블록 수. 1블록=원본 64×64px. 이 미만 영역은 노이즈로 폐기합니다.
residue_min_blocks = 3

# 사람 bbox 확장 여유. bbox 경계 흔들림을 흡수합니다.
residue_person_margin_blocks = 1

# 이 시간(초) 이상 지속되어야 이벤트를 발화합니다.
# 손님이 물건을 잠시 내려놓는 정상 행동(~40초)보다 길게 설정합니다.
residue_confirm_seconds = 60

# 이 시간(초) 미관측이면 잔류 해소로 판정합니다. 청소 중 가림 대비.
residue_clear_seconds = 10

# 안전 시점(사람 없음 + 후보 없음)에 기준을 자동 갱신하는 주기(초).
residue_baseline_refresh_seconds = 300

# 후보 블록이 이 비율을 넘으면 조명 변화로 해석하고 기준을 강제 갱신합니다.
residue_global_change_ratio = 0.5
