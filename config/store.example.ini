# 매장별 설정 파일 예시
# 실제 사용 시 이 파일을 복사하여 store.ini 로 저장하고
# --config config/store.ini 로 지정합니다.

# ── 초과 체류 감지 ──────────────────────────────────────────────────────────
# 착석 후 이 시간(초)이 지나면 "overstay" 이벤트를 발화합니다.
# 7~10평 무인 카페 기본값: 1시간(3600초)
dwell_limit_seconds = 3600

# ── 미주문 착석 감지 ─────────────────────────────────────────────────────────
# 입장 후 이 시간(초) 동안 키오스크 ROI를 통과하지 않으면 "unordered_seated" 발화.
# 손님이 메뉴를 고르는 시간을 감안해 기본 5분(300초).
unordered_grace_seconds = 300

# ── 쓰러짐 감지 ──────────────────────────────────────────────────────────────
# 수평 자세가 이 시간(초) 이상 지속되면 "person_fallen" 이벤트를 발화합니다.
# 짧으면 오탐, 길면 응급상황 대응이 늦어집니다. 기본 5초.
fall_hold_seconds = 5

# ── 모션 게이트 ───────────────────────────────────────────────────────────────
# 픽셀 변화 비율이 이 값 미만이면 정적 장면으로 판단해 YOLO 추론을 건너뜁니다.
# 0.004 = 그레이 버퍼(1/4 다운샘플)의 0.4% 픽셀이 8 이상 변해야 추론 실행.
# 빈 매장처럼 정적인 환경일수록 높여도 됩니다(최대 0.05 권장).
motion_ratio_threshold = 0.004

# 마지막 추론 이후 이 시간(초) 안에는 모션 게이트가 발동합니다.
# 10초마다 한 번은 강제로 추론해 새 진입자를 놓치지 않습니다.
idle_refresh_seconds = 10
