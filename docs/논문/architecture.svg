<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560" role="img" aria-labelledby="title desc">
<title id="title">무인 매장 환경·위생 감시 구조</title><desc id="desc">표면 비교와 사람 가림 판단으로 후보를 생성하고 선택적 AI 검사 및 규칙 알림을 수행한다.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#34495e" stroke-width="1.5"/></marker></defs>
<rect width="1400" height="560" fill="white"/>
<g font-family="sans-serif" fill="#193249" text-anchor="middle"><text x="700" y="45" font-size="28" font-weight="bold">무인 매장 환경·위생 감시 시스템</text>
<g stroke="#9fb3c8" stroke-width="2" fill="#f0f5fa"><rect x="30" y="160" width="180" height="105" rx="10"/><rect x="260" y="160" width="220" height="105" rx="10"/><rect x="530" y="160" width="220" height="105" rx="10"/><rect x="800" y="160" width="240" height="105" rx="10"/><rect x="1090" y="160" width="280" height="105" rx="10"/><rect x="270" y="330" width="210" height="95" rx="10"/><rect x="800" y="330" width="240" height="95" rx="10"/><rect x="1090" y="330" width="280" height="95" rx="10"/></g>
<g font-size="23"><text x="120" y="201">카메라 영상</text><text x="120" y="237" font-size="18">기존 사람 검출 공유</text><text x="370" y="200">표면 영역 설정</text><text x="370" y="237" font-size="18">바닥 · 테이블 · 벽</text><text x="640" y="200">규칙 기반 변화 비교</text><text x="640" y="237" font-size="18">96×96 표면 표본</text><text x="920" y="200">이용·가림 상태 판단</text><text x="920" y="237" font-size="18">보이는 부분만 관측</text><text x="1230" y="200">지속 변화 후보</text><text x="1230" y="237" font-size="18">퇴석 유예 · 지속 시간 확인</text><text x="375" y="367">정상 모습 등록</text><text x="375" y="398" font-size="18">기본 비치물 포함</text><text x="920" y="368">선택적 AI 검사</text><text x="920" y="398" font-size="18">동일 모습 재사용 · 동물 확인</text><text x="1230" y="368">관리자 확인 알림</text><text x="1230" y="398" font-size="18">청소 의심 / 동물 의심</text></g>
<text x="700" y="500" font-size="19">AI는 후보 검사를 보조하며, 청소 알림은 규칙 근거로도 발생한다.</text><text x="700" y="534" font-size="18" fill="#607284">영상상 변화·잔류물 감시이며 위생 안전성 또는 오염 종류를 확정하지 않는다.</text></g>
<g stroke="#34495e" stroke-width="2" fill="none" marker-end="url(#arrow)"><path d="M210 212H255"/><path d="M480 212H525"/><path d="M750 212H795"/><path d="M1040 212H1085"/><path d="M480 377H640V270"/><path d="M1190 265V297H920V325"/><path d="M1290 265V325"/><path d="M1040 378H1085"/></g>
</svg>
